---
name: Topology Hub Spoke
model: topology_hubspoke
rest_endpoint: /v1/feature-profile/sdwan/topology/%v/hubspoke
minimum_version: 20.15.0
has_version: true
id_attribute: id
test_tags: [SDWAN_2015]
skip_minimum_test: true
no_data_source_name_query: true
parcel_type: feature
doc_category: Features - Topology
attributes:
  - tf_name: feature_profile_id
    reference: true
    type: String
    mandatory: true
    description: Feature Profile ID
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_topology_feature_profile.test.id
  - model_name: vpn
    data_path: [target]
    tf_name: target_vpns
    no_augment_config: true
    type: Set
    element_type: String
    mandatory: true
    description: Target VPN list
    example: service_lan_vpn1
  - model_name: selectedHubs
    tf_name: selected_hubs
    no_augment_config: true
    type: Set
    element_type: String
    description: Selected hub sites
    example: SITE_100
    ignore_mandatory: true
    exclude_example: true
    test_tags: [SDWAN_2015]
  - model_name: selectedHierarchyHubs
    tf_name: selected_hierarchy_hubs
    no_augment_config: true
    type: Set
    element_type: String
    description: Selected hub network hierarchy UUIDs
    example: acb2ea53-4a95-4970-a1ab-9bac15edb961
    test_value: "[sdwan_network_hierarchy_node.network_hierarchy_node_site_test.id]"
    test_tags: [SDWAN_2018]
    conditional_attribute:
      conditions:
        - type: MinVersion
          value: 20.18.1
  - model_name: spokes
    tf_name: spokes
    no_augment_config: true
    type: List
    mandatory: true
    description: Spoke configurations
    attributes:
      - model_name: name
        tf_name: name
        type: String
        id: true
        mandatory: true
        description: Spoke name
        example: spoke1
      - model_name: spokeSites
        tf_name: spoke_sites
        type: Set
        element_type: String
        description: Spoke site list
        example: SITE_200
        ignore_mandatory: true
        exclude_example: true
        test_tags: [SDWAN_2015]
      - model_name: spokeHierarchyUuid
        tf_name: spoke_hierarchy_uuids
        no_augment_config: true
        type: Set
        element_type: String
        description: Spoke network hierarchy UUIDs
        example: acb2ea53-4a95-4970-a1ab-9bac15edb961
        test_value: "[sdwan_network_hierarchy_node.network_hierarchy_node_site_test.id]"
        test_tags: [SDWAN_2018]
        conditional_attribute:
          conditions:
            - type: MinVersion
              value: 20.18.1
      - model_name: hubSites
        tf_name: hub_sites
        type: List
        description: Hub site preferences
        exclude_null: true
        attributes:
          - model_name: sites
            tf_name: sites
            type: Set
            element_type: String
            description: Hub sites
            example: SITE_100
            ignore_mandatory: true
            exclude_example: true
            test_tags: [SDWAN_2015]
          - model_name: hierarchyUuid
            tf_name: hub_hierarchy_uuids
            no_augment_config: true
            type: Set
            element_type: String
            description: Hub network hierarchy UUIDs
            example: acb2ea53-4a95-4970-a1ab-9bac15edb961
            test_value: "[sdwan_network_hierarchy_node.network_hierarchy_node_site_test.id]"
            test_tags: [SDWAN_2018]
            conditional_attribute:
              conditions:
                - type: MinVersion
                  value: 20.18.1
          - model_name: preference
            tf_name: preference
            type: Int64
            mandatory: true
            min_int: 1
            max_int: 255
            description: Hub preference value
            example: 1

test_prerequisites: |
  resource "sdwan_topology_feature_profile" "test" {
    name        = "TF_TEST"
    description = "Terraform test"
  }
  resource "sdwan_network_hierarchy_node" "network_hierarchy_node_site_test" {
    parent_group    = "Global"
    name         = "TF_TEST_SITE"
    description  = "EMEA Region EMEA site update new"
    type         = "site"
    site_id      = 555
  }
