  - model_name: shapingRateDownstream
    tf_name: shaping_rate_downstream
    data_path: [aclQos]
    conditional_attribute:
      conditions:
        - name: tunnel_qos_mode
          value: hub
          negate: true
    example: false
    exclude_test: true
  - model_name: minShapingRateDownstream
    tf_name: min_shaping_rate_downstream
    data_path: [aclQos, shapingRateDownstreamConfig]
    conditional_attribute:
      conditions:
        - name: tunnel_qos_mode
          value: hub
          negate: true
    example: 100
    exclude_test: true
  - model_name: maxShapingRateDownstream
    tf_name: max_shaping_rate_downstream
    data_path: [aclQos, shapingRateDownstreamConfig]
    conditional_attribute:
      conditions:
        - name: tunnel_qos_mode
          value: hub
          negate: true
    example: 10000
    exclude_test: true
  - model_name: defaultShapingRateDownstream
    tf_name: default_shaping_rate_downstream
    data_path: [aclQos, shapingRateDownstreamConfig]
    conditional_attribute:
      conditions:
        - name: tunnel_qos_mode
          value: hub
          negate: true
    example: 1000
    exclude_test: true
  - model_name: shapingRate
    tf_name: shaping_rate
    data_path: [aclQos]
    example: 10000
    exclude_test: true
  - model_name: refId
    tf_name: acl_ipv4_egress_feature_id
    data_path: [aclQos, ipv4AclEgress]
    type: String
    description: IPv4 egress ACL feature ID. Variable references require Manager 20.18.1 or later.
    ignore_mandatory: true
    exclude_null: true
    conditional_attribute:
      operator: or
      conditions:
        - type: MinVersion
          value: 20.18.1
        - name: acl_ipv4_egress_feature_id
          value: ''
          negate: true
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_transport_ipv4_acl_feature.test.id
    exclude_test: true
  - model_name: refId
    tf_name: acl_ipv4_ingress_feature_id
    data_path: [aclQos, ipv4AclIngress]
    type: String
    description: IPv4 ingress ACL feature ID. Variable references require Manager 20.18.1 or later.
    ignore_mandatory: true
    exclude_null: true
    conditional_attribute:
      operator: or
      conditions:
        - type: MinVersion
          value: 20.18.1
        - name: acl_ipv4_ingress_feature_id
          value: ''
          negate: true
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_transport_ipv4_acl_feature.test.id
    exclude_test: true
  - model_name: refId
    tf_name: acl_ipv6_egress_feature_id
    data_path: [aclQos, ipv6AclEgress]
    type: String
    description: IPv6 egress ACL feature ID. Variable references require Manager 20.18.1 or later.
    ignore_mandatory: true
    exclude_null: true
    conditional_attribute:
      operator: or
      conditions:
        - type: MinVersion
          value: 20.18.1
        - name: acl_ipv6_egress_feature_id
          value: ''
          negate: true
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_transport_ipv6_acl_feature.test.id
    exclude_test: true
  - model_name: refId
    tf_name: acl_ipv6_ingress_feature_id
    data_path: [aclQos, ipv6AclIngress]
    type: String
    description: IPv6 ingress ACL feature ID. Variable references require Manager 20.18.1 or later.
    ignore_mandatory: true
    exclude_null: true
    conditional_attribute:
      operator: or
      conditions:
        - type: MinVersion
          value: 20.18.1
        - name: acl_ipv6_ingress_feature_id
          value: ''
          negate: true
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_transport_ipv6_acl_feature.test.id
    exclude_test: true

test_prerequisites: |
  resource "sdwan_transport_feature_profile" "test" {
    name        = "TF_TEST"
    description = "Terraform test"
  }

  resource "sdwan_transport_wan_vpn_feature" "test" {
    name               = "TF_TEST_WAN"
    description        = "Terraform test"
    feature_profile_id = sdwan_transport_feature_profile.test.id
    vpn                = 0
  }