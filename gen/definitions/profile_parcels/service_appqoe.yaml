---
name: Service AppQoE
rest_endpoint: /v1/feature-profile/sdwan/service/%v/appqoe
minimum_version: 20.15.0
test_tags: [SDWAN_2015]
parcel_type: feature
doc_category: Features - Service
res_description: >-
  `appqoe_device_role` selects which subtree is sent — `forwarder_*` for role `forwarder`,
  `combined_*` for `forwarderAndServiceNode`(`WithDre`), `service_node_*` for
  `serviceNode`(`WithDre`); attributes for the wrong role are silently dropped from the
  request and show as a permanent `terraform plan` diff. `combined_controller_groups`,
  `combined_service_node_groups`, and `service_node_service_node_groups` have no
  configurable fields (Manager fixes their names/addresses) — set each list item to `{}`.
  `combined_service_contexts` is required whenever the role is `combined`: leaving it empty
  deploys via the API but breaks the Manager GUI's own Save button. A `...WithDre` role
  requires `virtual_applications` with at least one entry (`{}` is fine) — omitting it while
  DRE is enabled sends an inconsistent payload the GUI never produces. `service_node_group`
  is the primary service node group bound to the context; `service_node_groups` lists every
  group bound to it (Manager supports binding more than one) — set both to the same single
  value/list when there's only one group.

# `appqoe_device_role` selects which subtree is sent: `forwarder_*` attributes apply
# only to the `forwarder` role, `combined_*` only to `forwarderAndServiceNode` /
# `forwarderAndServiceNodeWithDre`, and `service_node_*` only to `serviceNode` /
# `serviceNodeWithDre`. Attributes belonging to a role other than the configured one
# are silently omitted from the request.

# DRE optimization is enabled by selecting a `...WithDre` role, which also unlocks
# `virtual_applications` for the DRE resource profile.

# `forwarder_service_node_groups.name` should be left unset for the first group so the
# `SNG-APPQOE` default applies; SD-WAN Manager normalises any value equal to a default
# to `optionType: default`, which reads back as null and would show as permanent drift.

# service_node_group/service_node_groups on *_service_contexts: the Manager GUI supports
# binding multiple service node groups to one service context (serviceContext.appqoe[].
# serviceNodeGroups, a plural array binding) alongside the legacy singular
# serviceNodeGroup reference - both are sent together by the GUI, so both are modeled here
# as real, directly-settable attributes rather than one being derived from the other.
# serviceNodeGroups uses element_option_type because each array element is itself an
# {optionType,value} wrapper (unlike every other Set(String) in this provider, where the
# whole array is wrapped once) - see gen/schema/schema.yaml for the mechanism.

attributes:
  - tf_name: feature_profile_id
    reference: true
    type: String
    mandatory: true
    description: Feature Profile ID
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_service_feature_profile.test.id
  - model_name: appqoeDeviceRole
    example: forwarder
  - model_name: dreopt
    value: true
    value_type: global
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: Dre
          type: StringContains
  - model_name: dreopt
    value: false
    value_type: global
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: Dre
          type: StringContains
          negate: true
  - model_name: virtualApplication
    tf_name: virtual_applications
    positional_fallback: true
    exclude_test: true
    exclude_example: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: Dre
          type: StringContains
    attributes:
      - model_name: instanceId
        value: 1
        value_type: global
      - model_name: applicationType
        value: '"dreopt"'
        value_type: global
      - model_name: resourceProfile
        example: small
  - model_name: appnavControllerGroup
    tf_name: forwarder_controller_groups
    data_path: [forwarder]
    positional_fallback: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: forwarder
    attributes:
      - model_name: groupName
        value: '"ACG-APPQOE"'
      - model_name: appnavControllers
        positional_fallback: true
        attributes:
          - model_name: address
            id: true
            example: 192.168.2.1
          - model_name: vpn
            example: 1
  - model_name: serviceNodeGroup
    tf_name: forwarder_service_node_groups
    data_path: [forwarder]
    positional_fallback: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: forwarder
    attributes:
      - model_name: name
        id: true
        exclude_test: true
      - model_name: internal
        value: false
      - model_name: serviceNode
        tf_name: service_nodes
        positional_fallback: true
        attributes:
          - model_name: address
            id: true
            example: 192.168.2.2
  - model_name: appqoe
    tf_name: forwarder_service_contexts
    data_path: [forwarder, serviceContext]
    positional_fallback: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: forwarder
    attributes:
      - model_name: name
        value: '"/1"'
      - model_name: appnavControllerGroup
        id: true
        example: ACG-APPQOE
      - model_name: serviceNodeGroup
        example: SNG-APPQOE
      - model_name: serviceNodeGroups
        tf_name: service_node_groups
        type: Set
        element_type: String
        no_augment_config: true
        element_option_type: true
        description: Service node groups bound to this service context
        example: SNG-APPQOE
      - model_name: enable
        example: true
      - model_name: vpn
        example: 0
  - model_name: appnavControllerGroup
    tf_name: combined_controller_groups
    data_path: [forwarderAndServiceNode]
    positional_fallback: true
    exclude_test: true
    exclude_example: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: forwarderAndServiceNode
          type: StringContains
    attributes:
      - model_name: groupName
        value: '"ACG-APPQOE"'
      - model_name: appnavControllers
        positional_fallback: true
        attributes:
          - model_name: address
            value: '"192.168.2.1"'
  - model_name: serviceNodeGroup
    tf_name: combined_service_node_groups
    data_path: [forwarderAndServiceNode]
    positional_fallback: true
    exclude_test: true
    exclude_example: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: forwarderAndServiceNode
          type: StringContains
    attributes:
      - model_name: name
        value: '"SNG-APPQOE"'
      - model_name: internal
        value: true
      - model_name: serviceNode
        tf_name: service_nodes
        positional_fallback: true
        attributes:
          - model_name: address
            value: '"192.168.2.2"'
  - model_name: appqoe
    tf_name: combined_service_contexts
    data_path: [forwarderAndServiceNode, serviceContext]
    positional_fallback: true
    exclude_test: true
    exclude_example: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: forwarderAndServiceNode
          type: StringContains
    attributes:
      - model_name: name
        value: '"/1"'
      - model_name: appnavControllerGroup
        id: true
        example: ACG-APPQOE
      - model_name: serviceNodeGroup
        example: SNG-APPQOE
      - model_name: serviceNodeGroups
        tf_name: service_node_groups
        type: Set
        element_type: String
        no_augment_config: true
        element_option_type: true
        description: Service node groups bound to this service context
        example: SNG-APPQOE
      - model_name: enable
        example: true
      - model_name: vpn
        example: 0
  - model_name: serviceNodeGroup
    tf_name: service_node_service_node_groups
    data_path: [serviceNode]
    positional_fallback: true
    exclude_test: true
    exclude_example: true
    conditional_attribute:
      conditions:
        - name: appqoe_device_role
          value: serviceNode
          type: StringContains
    attributes:
      - model_name: name
        value: '"SNG-APPQOE"'
      - model_name: externalNode
        value: true
      - model_name: serviceNode
        tf_name: service_nodes
        positional_fallback: true
        attributes:
          - model_name: address
            value: '"192.168.2.2"'
          - model_name: vpgIp
            tf_name: vpg_ip
            value: '"192.168.2.1/24"'

test_prerequisites: |
  resource "sdwan_service_feature_profile" "test" {
    name = "TF_TEST"
    description = "Terraform test"
  }
