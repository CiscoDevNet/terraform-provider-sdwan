---
name: Transport Cellular Controller Feature Associate Cellular Profile Feature
rest_endpoint: /v1/feature-profile/sdwan/transport/%v/cellular-controller/%s/cellular-profile/
minimum_version: 20.15.0
has_version: true
id_attribute: parcelId
doc_category: Features - Transport
test_tags: [SDWAN_2015, SDWAN_2018]
attributes:
  - tf_name: feature_profile_id
    reference: true
    type: String
    mandatory: true
    description: Feature Profile ID
    example: f6dd22c8-0b4f-496c-9a0b-6813d1f8b8ac
    test_value: sdwan_transport_feature_profile.test.id
  - tf_name: transport_cellular_controller_feature_id
    reference: true
    type: String
    mandatory: true
    description: Transport Cellular Controller Feature ID
    example: 140331f6-5418-4755-a059-13c77eb96037
    test_value: sdwan_transport_cellular_controller_feature.test.id
  - model_name: parcelId
    tf_name: transport_cellular_profile_feature_id
    type: String
    mandatory: true
    description: Transport Cellular Profile Feature ID
    example: 140331f6-5418-4755-a059-13c77eb96037
    test_value: sdwan_transport_cellular_profile_feature.test.id

test_prerequisites: |
  resource "sdwan_transport_feature_profile" "test" {
    name        = "TF_TEST"
    description = "Terraform test"
  }

  resource "sdwan_transport_cellular_controller_feature" "test" {
    name               = "TF_TEST_CELLULAR_CONTROLLER"
    description        = "Terraform test"
    feature_profile_id = sdwan_transport_feature_profile.test.id
    cellular_id        = "0/3/0"
  }

  resource "sdwan_transport_cellular_profile_feature" "test" {
    name               = "TF_TEST_CELLULAR_PROFILE"
    description        = "Terraform test"
    feature_profile_id = sdwan_transport_feature_profile.test.id
    profile_id         = 2
    access_point_name  = "apn1"
  }
