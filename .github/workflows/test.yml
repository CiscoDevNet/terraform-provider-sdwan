# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # consecutiveness:
  #   name: Consecutiveness
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: mktcode/consecutive-workflow-action@325c790e765731dcd19a003e8e484e5e0afb84e7
  #       with:
  #         token: ${{ secrets.GITHUB_TOKEN }}

  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          # Pinned deliberately: this job runs `go generate` followed by
          # `git diff --exit-code`, so the Terraform version must be reproducible.
          # A floating version would let a new release change tfplugindocs output
          # and fail CI on an unrelated commit.
          # Must be >= 1.11, otherwise tfplugindocs cannot read write-only
          # attributes and the regenerated docs would not match the committed ones.
          terraform_version: 1.13.3
      - run: pip install yamale
      - run: yamale -s gen/schema/schema.yaml gen/definitions/
      - run: go mod download
      - run: go generate
      - run: git diff --exit-code
      - run: go build -v .

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: [build] # [consecutiveness, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        # NOTE: the acceptance test step below is currently commented out, so none
        # of these versions actually execute tests today. The matrix only installs
        # a toolchain. These entries describe what SHOULD be covered once the step
        # is re-enabled:
        #   1.10 - last release WITHOUT write-only support. Verifies the legacy
        #          secret spelling still works, and that the framework rejects a
        #          "_wo" attribute instead of silently storing its value.
        #   1.11 - first release WITH write-only support ("_wo" attributes).
        #   1.13 - tracks a current release.
        terraform:
          - "1.10.*"
          - "1.11.*"
          - "1.13.*"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      # - env:
      #     TF_ACC: '1'
      #     SDWAN_USERNAME: ${{ secrets.SDWAN_USERNAME }}
      #     SDWAN_PASSWORD: ${{ secrets.SDWAN_PASSWORD }}
      #     SDWAN_URL: ${{ secrets.SDWAN_URL }}
      #   run: go test -v -cover -timeout 45m ./internal/provider/
      #   timeout-minutes: 45
